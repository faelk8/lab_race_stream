services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-racestream}
      POSTGRES_USER: ${POSTGRES_USER:-racestream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-racestream}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    build:
      context: ./integrations/minio
      args:
        RELEASE: RELEASE.2025-10-15T17-29-55Z
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-racestream}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-racestream-local-only}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    build:
      context: ./integrations/minio
      args:
        RELEASE: RELEASE.2025-10-15T17-29-55Z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        until mc mb --ignore-existing local/$$MINIO_BUCKET; do sleep 2; done
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-racestream}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-racestream-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-racestream}
      MC_CONFIG_DIR: /tmp/mc-config
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_AVRO_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8081/subjects >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://schema-registry:8081
    restart: unless-stopped

  topic-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in race.telemetry.raw race.telemetry.raw.v4 race.telemetry.validated.v4 race.timing.crossed.v1 race.lap.completed.v1 race.pitstop.v1 race.incident.v1 race.control.v1 race.state.v1 race.analytics.v1 race.dead-letter.v1; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1 --config retention.ms=604800000
        done

  simulator:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: race.telemetry.raw
      DATABASE_URL: postgresql://${POSTGRES_USER:-racestream}:${POSTGRES_PASSWORD:-racestream}@postgres:5432/${POSTGRES_DB:-racestream}
      RACE_SEED: ${RACE_SEED:-42}
      RACE_TIME_SCALE: ${RACE_TIME_SCALE:-45}
      RACE_DURATION_SECONDS: ${RACE_DURATION_SECONDS:-120}
      RACE_TARGET_LAPS: ${RACE_TARGET_LAPS:-60}
      SIMULATION_INTERVAL_SECONDS: ${SIMULATION_INTERVAL_SECONDS:-0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "racestream.interfaces.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-racestream}:${POSTGRES_PASSWORD:-racestream}@postgres:5432/${POSTGRES_DB:-racestream}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: race.telemetry.raw
      KAFKA_DASHBOARD_GROUP: racestream-dashboard
      RACE_TIME_SCALE: ${RACE_TIME_SCALE:-45}
      RACE_DURATION_SECONDS: ${RACE_DURATION_SECONDS:-120}
      RACE_TARGET_LAPS: ${RACE_TARGET_LAPS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_KAFKA_CONSOLE_URL: ${VITE_KAFKA_CONSOLE_URL:-http://localhost:8080}
    restart: unless-stopped

  spark-archive:
    image: apache/spark:4.0.1-python3
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - local[1]
      - --driver-memory
      - 512m
      - --conf
      - spark.sql.shuffle.partitions=2
      - --conf
      - spark.jars.ivy=/opt/spark/work-dir/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1,org.apache.hadoop:hadoop-aws:3.4.1
      - /opt/racestream/arquivo_telemetria.py
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-racestream}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-racestream}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-racestream-local-only}
      SPARK_STARTING_OFFSETS: ${SPARK_STARTING_OFFSETS:-earliest}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-1000}
      SPARK_TRIGGER_INTERVAL: ${SPARK_TRIGGER_INTERVAL:-30 seconds}
      SPARK_LOG_LEVEL: WARN
      HOME: /tmp
    volumes:
      - ./stream-processing/spark:/opt/racestream:ro
      - spark-work:/opt/spark/work-dir
    mem_limit: 1200m
    cpus: 1.0
    restart: unless-stopped

  consumer:
    build: .
    command: ["python", "-m", "racestream.interfaces.stream_processor"]
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-racestream}:${POSTGRES_PASSWORD:-racestream}@postgres:5432/${POSTGRES_DB:-racestream}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: race.telemetry.raw
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-racestream-local-consumer}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
  minio-data:
  spark-work:
